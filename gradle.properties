# Versions verified 2026-09-16: LSP4IJ 0.20.1 (Community-compatible, IntelliJ 2024.2+),
# IntelliJ Platform Gradle Plugin 2.16.0. Bump as needed.
pluginGroup = org.ek9lang.intellij
pluginName = EK9
pluginVersion = 0.0.1

# Target IDE: IntelliJ IDEA Community. 2024.3 is a safe LSP4IJ-compatible base; the plugin runs on
